<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BortexIA</title>
  <link rel="icon" href="logo/iconomain.png">
  <meta name="theme-color" content="#0a84ff">
  <link rel="stylesheet" href="assets/styles.css">
</head>

<body data-empty="true">
  <aside class="sidebar" aria-label="Historial de chats" hidden>
    <header class="sidebar__header">
      <h2>Chats</h2>
      <div class="sidebar__actions">
        <button type="button" class="export-md" title="Exportar Markdown" aria-label="Exportar Markdown">
          <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#markdown"></use></svg>
          <span>MD</span>
        </button>
        <button type="button" class="export-json" title="Exportar JSON" aria-label="Exportar JSON">
          <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#download"></use></svg>
          <span>JSON</span>
        </button>
        <button type="button" class="sidebar__toggle" title="Colapsar (B)" aria-label="Colapsar (B)">
          <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#stop"></use></svg>
          <span>Colapsar</span>
        </button>
        <button type="button" class="new-chat">
          <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#refresh"></use></svg>
          <span>Nuevo</span>
        </button>
      </div>
    </header>
    <ul class="chat-list" role="list"></ul>
  </aside>
  <section class="hero" aria-label="Bienvenido a BortexIA">
    <div class="hero__brand">
      <img src="logo/iconomain.png" alt="Logo BortexIA" class="hero__logo" loading="lazy">
      <h1>BortexIA</h1>
      <p class="hero__tagline">Pregunta cualquier cosa. Yo me encargo del resto.</p>
    </div>
  </section>
  <main>
    <ul aria-live="polite" aria-atomic="false" role="log">
    </ul>
  </main>

  <form class="composer" aria-label="Compositor de preguntas">
    <div class="composer__box">
      <textarea rows="1" placeholder="Pregunta cualquier cosa o menciona un espacio" aria-label="Escribir mensaje"></textarea>
      <div class="composer__actions">
        <div class="composer__left">
          <button type="button" class="icon" title="Buscar" aria-label="Buscar">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#search"></use></svg>
          </button>
          <button type="button" class="icon" title="Reformular" aria-label="Reformular">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#refresh"></use></svg>
          </button>
          <button type="button" class="icon" title="Idea" aria-label="Idea">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#bulb"></use></svg>
          </button>
          <button type="button" class="icon clear" title="Borrar chat" aria-label="Borrar chat">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#trash"></use></svg>
          </button>
          <button type="button" class="icon toggle-sources" aria-pressed="false" title="Fuentes" aria-label="Fuentes">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#paperclip"></use></svg>
            <span>Fuentes</span>
          </button>
        </div>
        <div class="composer__right">
          <button type="button" class="icon" title="Idioma" aria-label="Idioma">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#globe"></use></svg>
          </button>
          <button type="button" class="icon" title="Ajustes" aria-label="Ajustes">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#settings"></use></svg>
          </button>
          <button type="button" class="icon" title="Adjuntar" aria-label="Adjuntar">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#paperclip"></use></svg>
          </button>
          <button type="button" class="icon" title="Voz" aria-label="Voz">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#mic"></use></svg>
          </button>
          <button type="button" class="stop" hidden aria-label="Detener">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#stop"></use></svg>
            <span>Detener</span>
          </button>
          <button type="submit" class="send" disabled aria-label="Enviar mensaje">
            <svg width="18" height="18" aria-hidden="true"><use href="assets/icons.svg#send"></use></svg>
            <span>Enviar</span>
          </button>
        </div>
      </div>
    </div>
  </form>

  <small>&nbsp;</small>

  <template id="message-template">
    <li class="message">
      <span></span>
      <p></p>
      <div class="sources" hidden></div>
    </li>
  </template>
  <script type="module" src="assets/app.js"></script>
</body>

</html>
